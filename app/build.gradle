plugins {
    id 'com.android.application'
}

android {
    namespace 'com.todesk.dreamhook'
    compileSdk 33

    defaultConfig {
        applicationId "com.todesk.dreamhook"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed API 只参与编译，运行时由 LSPosed 提供
    compileOnly 'de.robv.android.xposed:api:82'
}